default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    # High priority worker for small imports (fast turnaround)
    - queues: small_import
      threads: 2
      processes: 1
      polling_interval: 0.1
    # Worker for large imports (more threads for parallelism)
    - queues: large_import
      threads: 4
      processes: 1
      polling_interval: 0.5
    # Worker for everything else (anomaly detection, etc)
    - queues: default
      threads: 3
      processes: 1
      polling_interval: 0.1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
